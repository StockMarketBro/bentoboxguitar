<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bentobox Guitar</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#121317;--panel:#1b1d23;--line:#2a2d36;--paper:#f3eee3;--ink:#1a1712;--ink-soft:#8a8275;
 --fret:#c9c3b5;--inlay:#d8cfb8;--hot:#ff4f5e;--hot-soft:rgba(255,79,94,.2);--text:#e9e7e1;--muted:#8d9199;--ok:#6fd39a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:16px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header img{height:44px}
header h1{font-family:Syne,sans-serif;font-weight:800;font-size:22px;margin:0;letter-spacing:-.02em}
header h1 span{color:var(--hot)}
header .sub{color:var(--muted);font-size:13px;margin-left:auto}
main{padding:18px 28px 50px;max-width:1240px;margin:0 auto}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px;position:sticky;top:8px;z-index:5}
button,select,input[type=number]{font:500 13px Inter,sans-serif;background:#24272f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer}
input[type=number]{width:72px;font-family:"DM Mono",monospace}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
button.play{background:var(--hot);border-color:var(--hot);color:#fff;min-width:110px}
.lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.lbl input[type=range]{accent-color:var(--hot)}
.lbl output{font-family:"DM Mono",monospace;color:var(--text);min-width:44px}
.time{font-family:"DM Mono",monospace;font-size:13px;margin-left:auto;color:var(--muted)}
.time b{color:var(--text);font-weight:500}

.track{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.track.muted{opacity:.55}
.t-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.t-head h2{font-family:Syne,sans-serif;font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:0 10px 0 0}
.t-head h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tc);margin-right:8px}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.status{font-size:12px;color:var(--muted);flex-basis:100%;display:flex;align-items:center;gap:10px;min-height:18px}
.prog{flex:1;max-width:320px;height:6px;background:#0e0f12;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--tc);transition:width .2s}
.tab{background:var(--paper);border-radius:10px;padding:12px 10px 8px;position:relative}
.tab canvas{display:block;width:100%;height:auto}
.tab .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:14px;text-align:center;padding:20px}
.fb{margin-top:12px}
.fb svg{width:100%;height:auto;display:block}
.pos{cursor:pointer}.pos circle{fill:transparent}.pos:hover circle{fill:rgba(255,255,255,.12)}
.fb-info{font-size:12px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toggle{background:#24272f}.toggle.on{background:var(--tc);color:#111;border-color:var(--tc)}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
@media (max-width:720px){header,main{padding-left:12px;padding-right:12px}.time{margin-left:0;flex-basis:100%}}
</style>
</head>

import * as tf from 'https://esm.sh/@tensorflow/tfjs@3.21.0';
import { BasicPitch, outputToNotesPoly, noteFramesToTime, addPitchBendsToNoteEvents } from 'https://esm.sh/@spotify/basic-pitch@1.0.1?deps=@tensorflow/tfjs@3.21.0';
const MODEL_URL='https://cdn.jsdelivr.net/npm/@spotify/basic-pitch@1.0.1/model/model.json';

// ===== Config instrumentos =====
const NOTE_NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const DEFS={
  guitar:{label:"Guitarra",color:"#ff4f5e",frets:22,
    tunings:{std:{n:"Estándar (E A D G B E)",m:[40,45,50,55,59,64]},drop:{n:"Drop D",m:[38,45,50,55,59,64]},half:{n:"Medio tono abajo",m:[39,44,49,54,58,63]},dropC:{n:"Drop C#",m:[37,44,49,54,58,63]},seven:{n:"7 cuerdas (B E A D G B E)",m:[35,40,45,50,55,59,64]}},
    minFreq:70,maxFreq:1400,onset:0.5,frame:0.3},
  bass:{label:"Bajo",color:"#5ec2ff",frets:20,
    tunings:{std:{n:"Estándar (E A D G)",m:[28,33,38,43]},drop:{n:"Drop D",m:[26,33,38,43]},half:{n:"Medio tono abajo",m:[27,32,37,42]},five:{n:"5 cuerdas (B E A D G)",m:[23,28,33,38,43]}},
    minFreq:30,maxFreq:450,onset:0.5,frame:0.3}
};
const nn=m=>NOTE_NAMES[m%12];
const $=(id,root=document)=>root.querySelector(id);

// ===== Estado global =====
let model=null, playing=false, raf=null, t0=0, startAt=0;
const tracks={};
const bpm=()=>+$("#bpm").value||120;
const grid=()=>+$("#grid").value;
const stepSec=()=>60/bpm()/grid();
const rate=()=>$("#rate").value/100;

// ===== Carga modelo =====
(async()=>{try{
  await tf.ready();
  model=new BasicPitch(tf.loadGraphModel(MODEL_URL));
  await model.model;
  $("#modelStatus").textContent="Modelo listo · sube tus pistas";
  $("#modelStatus").style.color="var(--ok)";
  document.querySelectorAll(".file input").forEach(i=>i.disabled=false);
}catch(e){console.error(e);$("#modelStatus").textContent="No se pudo cargar el modelo (revisa tu conexión)";$("#modelStatus").style.color="var(--hot)";}})();

// ===== Track =====
function makeTrack(kind){
  const d=DEFS[kind];
  const el=document.createElement("section"); el.className="track"; el.style.setProperty("--tc",d.color);
  el.innerHTML=`
    <div class="t-head">
      <h2>${d.label}</h2>
      <button class="file">Subir pista<input type="file" accept="audio/*" disabled></button>
      <select class="tuning">${Object.entries(d.tunings).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join("")}</select>
      <label class="lbl">Sensibilidad <input type="range" class="sens" min="20" max="80" value="50"></label>
      <button class="retrans" disabled>Re-transcribir</button>
      <button class="toggle mute">Silencio</button>
      <button class="toggle solo">Solo</button>
      <label class="lbl" style="margin-left:auto">Vol <input type="range" class="vol" min="0" max="100" value="90"></label>
      <div class="status"><span class="msg">Sin pista. Sube el stem de ${d.label.toLowerCase()} (WAV o MP3).</span><div class="prog" hidden><i></i></div></div>
    </div>
    <div class="tab"><canvas></canvas><div class="empty">La tablatura aparecerá aquí después de transcribir.</div></div>
    <div class="fb"><svg viewBox="0 0 1100 ${kind==="bass"?190:210}" role="img" aria-label="Mástil ${d.label}"></svg>
      <div class="fb-info"><span class="posInfo">Haz clic en la tab para elegir un paso, luego toca el mástil para corregir la nota.</span><span class="count"></span></div></div>`;
  $("#tracks").appendChild(el);
  const T={kind,d,el,audio:null,gain:null,buffer:null,rawNotes:[],steps:[],cursor:0,muted:false,solo:false,
    tuning:()=>d.tunings[$(".tuning",el).value].m};
  tracks[kind]=T;
  $(".file input",el).onchange=e=>loadFile(T,e.target.files[0]);
  $(".tuning",el).onchange=()=>{if(T.rawNotes.length)buildSteps(T);drawTab(T);drawFret(T);};
  $(".retrans",el).onclick=()=>transcribe(T);
  $(".mute",el).onclick=e=>{T.muted=!T.muted;e.target.classList.toggle("on",T.muted);el.classList.toggle("muted",T.muted);applyMix();};
  $(".solo",el).onclick=e=>{T.solo=!T.solo;e.target.classList.toggle("on",T.solo);applyMix();};
  $(".vol",el).oninput=applyMix;
  $(".tab canvas",el).onclick=e=>{ if(!T.steps.length)return; const r=e.target.getBoundingClientRect(); const x=(e.clientX-r.left)*(e.target.width/r.width);
    const i=Math.floor((x-40)/COLW)+T.view; if(i>=0&&i<T.steps.length){T.cursor=i;seekAll(i*stepSec());} };
  drawFret(T);
  return T;
}

async function loadFile(T,file){
  if(!file)return;
  const msg=$(".msg",T.el); msg.textContent=`Decodificando ${file.name}…`;
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const buf=await ac.decodeAudioData(await file.arrayBuffer());
  T.buffer=buf;
  if(T.audio){T.audio.pause();URL.revokeObjectURL(T.audio.src);}
  T.audio=new Audio(URL.createObjectURL(file)); T.audio.preservesPitch=true;
  T.audio.volume=$(".vol",T.el).value/100;
  updateTotal();
  $(".retrans",T.el).disabled=false;
  await transcribe(T);
}

async function transcribe(T){
  if(!model||!T.buffer)return;
  const msg=$(".msg",T.el), prog=$(".prog",T.el), bar=$(".prog i",T.el);
  prog.hidden=false; bar.style.width="0"; msg.textContent="Preparando audio (22.05 kHz mono)…";
  // remuestrear a 22050 mono
  const src=T.buffer, len=Math.ceil(src.duration*22050);
  const off=new OfflineAudioContext(1,len,22050);
  const s=off.createBufferSource(); s.buffer=src; s.connect(off.destination); s.start();
  const mono=await off.startRendering();
  const frames=[],onsets=[],contours=[];
  msg.textContent="Transcribiendo…";
  await model.evaluateModel(mono,(f,o,c)=>{frames.push(...f);onsets.push(...o);contours.push(...c);},p=>{bar.style.width=Math.round(p*100)+"%";});
  const sens=$(".sens",T.el).value/100; // más sensibilidad = umbrales más bajos
  const onsetT=0.8-sens*0.6, frameT=0.55-sens*0.4;
  const notes=noteFramesToTime(addPitchBendsToNoteEvents(contours,outputToNotesPoly(frames,onsets,onsetT,frameT,T.kind==="bass"?6:4,true,T.d.maxFreq,T.d.minFreq,true,11)));
  T.rawNotes=notes.map(n=>({m:n.pitchMidi,t:n.startTimeSeconds,d:n.durationSeconds,a:n.amplitude}));
  prog.hidden=true;
  if(!$("#bpm").dataset.user) estimateBpm(T);
  buildSteps(T); T.cursor=0; drawTab(T); drawFret(T);
  msg.textContent=`${T.rawNotes.length} notas detectadas · ${Math.round(src.duration)} s. Ajusta BPM/rejilla si la tab no cuadra.`;
  $("#play").disabled=$("#stop").disabled=$("#exportTxt").disabled=false;
}

function estimateBpm(T){ // mediana de intervalos entre ataques → candidato entre 70 y 180
  const ts=[...new Set(T.rawNotes.map(n=>Math.round(n.t*100)/100))].sort((a,b)=>a-b);
  const d=[]; for(let i=1;i<ts.length;i++){const x=ts[i]-ts[i-1]; if(x>0.08&&x<2)d.push(x);}
  if(d.length<8)return; d.sort((a,b)=>a-b); let ioi=d[Math.floor(d.length/2)]; let b=60/ioi;
  while(b<70)b*=2; while(b>180)b/=2; $("#bpm").value=Math.round(b);
}

// ===== Digitación =====
function buildSteps(T){
  const tun=T.tuning(), F=T.d.frets, ss=stepSec();
  const nSteps=Math.ceil((T.buffer.duration)/ss)+1;
  const steps=Array.from({length:nSteps},()=>[]);
  // agrupar notas por paso (cuantización al inicio)
  const byStep=Array.from({length:nSteps},()=>[]);
  T.rawNotes.forEach(n=>{const i=Math.round(n.t/ss); if(i>=0&&i<nSteps)byStep[i].push(n);});
  let hand=2; // posición de mano estimada
  byStep.forEach((ns,i)=>{
    if(!ns.length)return;
    const uniq=[...new Map(ns.map(n=>[n.m,n])).values()].sort((a,b)=>a.m-b.m);
    const used=new Set(); const out=[];
    uniq.forEach(n=>{
      let best=null;
      tun.forEach((open,s)=>{ if(used.has(s))return; const f=n.m-open; if(f<0||f>F)return;
        const cost=(f===0?0:Math.abs(f-hand))+f*0.12+(f>12?3:0);
        if(!best||cost<best.cost)best={s,f,cost}; });
      if(best){used.add(best.s);out.push({s:best.s,f:best.f,d:n.d});}
    });
    if(out.length){ const fr=out.filter(x=>x.f>0).map(x=>x.f); if(fr.length)hand=hand*0.5+ (fr.reduce((a,b)=>a+b)/fr.length)*0.5; }
    steps[i]=out;
  });
  T.steps=steps; T.view=0;
  $(".count",T.el).textContent=`${steps.filter(s=>s.length).length} pasos con notas · ${steps.length} pasos totales`;
}

// ===== Tab (canvas) =====
const COLW=30, ROWH=22;
function drawTab(T){
  const cv=$(".tab canvas",T.el), empty=$(".tab .empty",T.el);
  const n=T.tuning().length;
  const W=1180, H=n*ROWH+40; cv.width=W; cv.height=H;
  const g=cv.getContext("2d"); g.clearRect(0,0,W,H);
  if(!T.steps.length){empty.hidden=false;return;} empty.hidden=true;
  const cols=Math.floor((W-40)/COLW);
  if(T.cursor<T.view||T.cursor>=T.view+cols-2)T.view=Math.max(0,T.cursor-Math.floor(cols/3));
  const tun=T.tuning(), perBar=grid()*4;
  // nombres de cuerdas
  g.font="12px 'DM Mono'"; g.fillStyle="#8a8275"; g.textAlign="center"; g.textBaseline="middle";
  for(let r=0;r<n;r++){const y=20+r*ROWH; g.fillText(nn(tun[n-1-r]),16,y);}
  for(let r=0;r<n;r++){const y=20+r*ROWH; g.strokeStyle="#a79f8f"; g.lineWidth=1; g.beginPath(); g.moveTo(36,y); g.lineTo(W-6,y); g.stroke();}
  for(let c=0;c<cols;c++){
    const i=T.view+c; if(i>=T.steps.length)break;
    const x=40+c*COLW+COLW/2;
    if(i%perBar===0){g.strokeStyle="#6a6356";g.lineWidth=1.5;g.beginPath();g.moveTo(x-COLW/2,20);g.lineTo(x-COLW/2,20+(n-1)*ROWH);g.stroke();
      g.fillStyle="#8a8275";g.font="10px 'DM Mono'";g.fillText(Math.floor(i/perBar)+1,x-COLW/2+2,H-8);}
    if(i===T.cursor){g.fillStyle="rgba(255,79,94,.18)";g.fillRect(x-COLW/2,6,COLW,(n-1)*ROWH+28);g.fillStyle=T.d.color;g.beginPath();g.arc(x,6,3.5,0,7);g.fill();}
    T.steps[i].forEach(({s,f})=>{ const y=20+(n-1-s)*ROWH; const txt=String(f); g.font="500 14px 'DM Mono'";
      const w=g.measureText(txt).width+6; g.fillStyle="#f3eee3"; g.fillRect(x-w/2,y-9,w,18);
      g.fillStyle=i===T.cursor?T.d.color:"#1a1712"; g.fillText(txt,x,y); });
  }
}

// ===== Mástil (SVG) =====
function drawFret(T){
  const svg=$(".fb svg",T.el), tun=T.tuning(), n=tun.length, F=T.d.frets;
  const X0=70,W=1000,Y0=30,H=n===4?110:140, gap=H/(n-1);
  const xs=[0]; let p=0; const tot=F*(F+1)/2; for(let i=1;i<=F;i++){p+=(F+1-i)*(W/tot);xs.push(p);}
  const fx=f=>X0+xs[f], cx=f=>f===0?X0-2:(fx(f)+fx(f-1))/2;
  let s=`<defs><linearGradient id="wood${T.kind}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#45291a"/><stop offset="1" stop-color="#2a1a10"/></linearGradient></defs>
    <rect x="${X0}" y="${Y0-14}" width="${W}" height="${H+28}" rx="6" fill="url(#wood${T.kind})"/><rect x="${X0-6}" y="${Y0-14}" width="8" height="${H+28}" fill="#e9e2cf"/>`;
  for(let f=1;f<=F;f++){ s+=`<rect x="${fx(f)-1.3}" y="${Y0-14}" width="2.6" height="${H+28}" fill="var(--fret)"/>`;
    if([3,5,7,9,15,17,19,21].includes(f))s+=`<circle cx="${cx(f)}" cy="${Y0+H/2}" r="4.5" fill="var(--inlay)" opacity=".7"/>`;
    if(f===12)s+=`<circle cx="${cx(f)}" cy="${Y0+H*.3}" r="4.5" fill="var(--inlay)" opacity=".7"/><circle cx="${cx(f)}" cy="${Y0+H*.7}" r="4.5" fill="var(--inlay)" opacity=".7"/>`;
    s+=`<text x="${cx(f)}" y="${Y0+H+28}" font-size="10" fill="var(--muted)" text-anchor="middle" font-family="DM Mono">${f}</text>`; }
  for(let i=0;i<n;i++){const y=Y0+H-i*gap; const th=T.kind==="bass"?4.5-i*.6:3.2-i*.4;
    s+=`<line x1="${X0-6}" x2="${X0+W}" y1="${y}" y2="${y}" stroke="#d6d1c3" stroke-width="${th}" opacity=".85"/><text x="${X0-22}" y="${y+4}" font-size="12" fill="var(--muted)" text-anchor="middle" font-family="DM Mono">${nn(tun[i])}</text>`;}
  for(let i=0;i<n;i++)for(let f=0;f<=F;f++)s+=`<g class="pos" data-s="${i}" data-f="${f}"><circle cx="${cx(f)}" cy="${Y0+H-i*gap}" r="11"/></g>`;
  const step=T.steps[T.cursor]||[];
  step.forEach(({s:si,f})=>{const y=Y0+H-si*gap;s+=`<g pointer-events="none"><circle cx="${cx(f)}" cy="${y}" r="13" fill="${T.d.color}"/><text x="${cx(f)}" y="${y+4}" font-size="10" font-weight="700" fill="#111" text-anchor="middle" font-family="Inter">${nn(tun[si]+f)}</text></g>`;});
  svg.innerHTML=s;
  svg.querySelectorAll(".pos").forEach(g=>g.onclick=()=>{
    if(!T.steps.length)return; const si=+g.dataset.s,f=+g.dataset.f,st=T.steps[T.cursor]; const k=st.findIndex(x=>x.s===si);
    if(k>=0&&st[k].f===f)st.splice(k,1); else if(k>=0)st[k].f=f; else st.push({s:si,f,d:stepSec()});
    drawTab(T);drawFret(T);preview(T,st);
    $(".posInfo",T.el).textContent=st.length?`Paso ${T.cursor+1}: `+st.map(x=>`${nn(tun[x.s])} ${x.f} (${nn(tun[x.s]+x.f)})`).join(" + "):`Paso ${T.cursor+1}: silencio`;
  });
}
let pac;
function preview(T,st){ pac=pac||new (window.AudioContext||window.webkitAudioContext)(); const tun=T.tuning();
  st.forEach(({s,f})=>{const fr=440*Math.pow(2,(tun[s]+f-69)/12),t=pac.currentTime,o=pac.createOscillator(),g=pac.createGain(),lp=pac.createBiquadFilter();
    o.type="sawtooth";o.frequency.value=fr;lp.type="lowpass";lp.frequency.setValueAtTime(T.kind==="bass"?800:2400,t);lp.frequency.exponentialRampToValueAtTime(300,t+.4);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.5);o.connect(lp);lp.connect(g);g.connect(pac.destination);o.start(t);o.stop(t+.55);});
}

// ===== Transporte =====
const all=()=>Object.values(tracks).filter(t=>t.audio);
function applyMix(){ const anySolo=Object.values(tracks).some(t=>t.solo);
  Object.values(tracks).forEach(t=>{ if(!t.audio)return; const on=anySolo?t.solo:!t.muted; t.audio.volume=on?$(".vol",t.el).value/100:0; }); }
function updateTotal(){ const d=Math.max(0,...all().map(t=>t.audio.duration||t.buffer.duration)); $("#tTot").textContent=fmt(d); }
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function seekAll(t){ all().forEach(x=>x.audio.currentTime=t); tick(true); }
function tick(force){
  const m=all()[0]; if(!m)return; const t=m.audio.currentTime; $("#tNow").textContent=fmt(t)+"."+Math.floor((t%1)*10);
  const i=Math.floor(t/stepSec());
  Object.values(tracks).forEach(T=>{ if(!T.steps.length)return; if(T.cursor!==i||force){T.cursor=Math.min(i,T.steps.length-1);drawTab(T);drawFret(T);} });
  if(playing){ if(m.audio.ended){stopAll(false);} else raf=requestAnimationFrame(()=>tick()); }
}
function playAll(){ playing=true; $("#play").textContent="❚❚ Pausar"; applyMix(); all().forEach(x=>{x.audio.playbackRate=rate();x.audio.play();}); tick(); }
function pauseAll(){ playing=false; $("#play").textContent="▶ Reproducir"; cancelAnimationFrame(raf); all().forEach(x=>x.audio.pause()); }
function stopAll(){ pauseAll(); seekAll(0); }
$("#play").onclick=()=>playing?pauseAll():playAll();
$("#stop").onclick=stopAll;
$("#rate").oninput=e=>{$("#rateOut").textContent=e.target.value+" %"; all().forEach(x=>x.audio.playbackRate=rate());};
$("#bpm").oninput=()=>{$("#bpm").dataset.user=1; Object.values(tracks).forEach(T=>{if(T.rawNotes.length){buildSteps(T);drawTab(T);drawFret(T);}});};
$("#grid").onchange=()=>Object.values(tracks).forEach(T=>{if(T.rawNotes.length){buildSteps(T);drawTab(T);drawFret(T);}});
window.addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return; if(e.code==="Space"){e.preventDefault();$("#play").click();}
  if(e.code==="ArrowRight"||e.code==="ArrowLeft"){const m=all()[0];if(!m)return;seekAll(Math.max(0,m.audio.currentTime+(e.code==="ArrowRight"?1:-1)*stepSec()));} });

// ===== Exportar =====
$("#exportTxt").onclick=()=>{
  let out=`Bentobox Guitar — ${bpm()} BPM, rejilla 1/${grid()*4}\n\n`;
  Object.values(tracks).forEach(T=>{ if(!T.steps.length)return; const tun=T.tuning(),n=tun.length,perBar=grid()*4,perLine=perBar*4;
    out+=`[${T.d.label} · ${$(".tuning",T.el).selectedOptions[0].text}]\n`;
    for(let start=0;start<T.steps.length;start+=perLine){
      const lines=Array.from({length:n},(_,r)=>nn(tun[n-1-r]).padEnd(2)+"|");
      for(let i=start;i<Math.min(start+perLine,T.steps.length);i++){
        for(let r=0;r<n;r++){const s=n-1-r; const h=T.steps[i].find(x=>x.s===s); lines[r]+=(h?String(h.f):"-").padEnd(3,"-");}
        if((i+1)%perBar===0)for(let r=0;r<n;r++)lines[r]+="|";
      }
      out+=lines.join("\n")+"\n\n";
    }});
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([out],{type:"text/plain"})); a.download="bentobox-tab.txt"; a.click();
};

makeTrack("guitar"); makeTrack("bass");
</script>
</body>
</html>
